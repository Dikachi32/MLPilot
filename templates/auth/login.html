{% extends "base.html" %}
{% block title %}Login — MLPilot{% endblock %}
{% block content %}
<div class="card fade-up" style="max-width:480px;margin:3rem auto;">
  <h2>Welcome Back</h2>
  <form method="POST">
    <input type="text" name="identifier" placeholder="Email or Username" required style="width:100%;padding:10px;margin-bottom:10px;border:1px solid var(--border);border-radius:var(--radius-sm);">
    <input type="password" name="password" placeholder="Password" required style="width:100%;padding:10px;margin-bottom:10px;border:1px solid var(--border);border-radius:var(--radius-sm);">
    <button type="submit" class="btn btn-primary btn-full">Sign In</button>
  </form>
  <p style="text-align:center;margin-top:1rem;font-size:13px;">New here? <a href="{{ url_for('auth.register') }}">Start free trial</a></p>
</div>
{% endblock %}
